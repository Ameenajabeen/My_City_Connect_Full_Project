name: my_city_connect_citizen
description: Citizen Mobile App for My City Connect civic issue management platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & Real-time
  dio: ^5.4.1
  web_socket_channel: ^2.4.5

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Device Hardware: Location & Camera
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7

  # Maps
  google_maps_flutter: ^2.6.0

  # Push Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # UI Enhancements & Material Icons
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
